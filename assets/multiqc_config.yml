custom_logo: "nf-core-mhcquant_logo_light.png"
custom_logo_url: https://github.com/nf-core/mhcquant
custom_logo_title: "nf-core/mhcquant"

report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/mhcquant/tree/dev" target="_blank">nf-core/mhcquant</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/mhcquant/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-mhcquant-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-mhcquant-summary":
    order: -1002

export_plots: true
disable_version_detection: true

# Control how outliers are displayed in box plots
boxplot_boxpoints: "false"

# Modules to run
run_modules:
  - custom_content
  - percolator

# Custom tables and plots
custom_data:
  # Summary of general statistics
  stats_table:
    plot_type: "table"
    file_format: "csv"
    section_name: "General Statistics"
    pconfig:
      id: "general_stats"
      title: "General Statistics"

  # Summary of chromatogram plot
  chromatogram:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "MS1 Chromatogram"
    description: |
      An MS1 chromatogram is a plot of the intensity of precursor ions (MS1) detected over time,
      typically with retention time (RT) on the x-axis and ion intensity on the y-axis.
      It represents the total ion current (TIC) from the MS1 scan,
      which is useful for monitoring the overall elution profile of compounds during a chromatographic separation.
    pconfig:
      xlab: "Retention time [min]"
      xmin: 0
      ylab: "Intensity"
      logswitch: true
      logswitch_active: true

  # Mass error plot
  mass_error:
    plot_type: "boxplot"
    file_format: "tsv"
    section_name: "Fragment mass error"
    description: |
      The fragment mass error describes the differences between observed and theoretical fragment ion masses.
      It helps assessing the accuracy and calibration of the mass spectrometer by visualizing the error range
      and potential deviations. Depending on your configurations this error is plotted in Dalton (Da)
      or parts-per-million (ppm).
    pconfig:
      xlab: "Mass deviation [Da/ppm]"

  len_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Peptide lengths"
    description: |
      This plot shows the distribution of peptide sequence lengths to assess variability and typical length ranges.
    pconfig:
      id: "length_dist"
      title: "Distribution of peptide lengths"
      xlab: "Length"
      ylab: "Frequency"

  mz_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Mass-to-Charge"
    description: |
      This plot displays the distribution of precursor ion mass-to-charge (m/z) values detected in the dataset.
      It helps identify the typical m/z ranges and assess the overall coverage and instrument performance during acquisition.
    pconfig:
      id: "histogram_mz"
      title: "Mass-to-Charge Histogram"
      xlab: "m/z"
      ylab: "Frequency"

  rt_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Retention time"
    description: |
      This plot shows the distribution of peptide retention times across the chromatographic gradient.
      It provides insight into peptide elution profiles and helps assess gradient performance and sample complexity.
    pconfig:
      id: "histogram_rt"
      title: "Retention time Histogram"
      xlab: "Retention time"
      ylab: "Frequency"

  qvalue_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Q-Value"
    description: |
      A q-value histogram in Percolator visualizes q-value distributions for PSMs, helping set the FDR threshold (typically 1%).
      It ensures only high-confidence identifications are retained, with a sharp drop-off beyond the threshold.
    pconfig:
      id: "histogram_scores"
      title: "Percolator q-value Histogram"
      xlab: "q-value"
      ylab: "Frequency"

  scores_plot_xcorr:
    plot_type: "boxplot"
    file_format: "csv"
    section_name: "Xcorr-Value"
    description: |
      The Comet Xcorr boxplot visualizes the cross-correlation (Xcorr) score distribution for PSMs, indicating match quality.
      Higher Xcorr values signify better peptide-spectrum matches.
      This helps set a threshold to filter out low-confidence identifications.
    pconfig:
      id: "scores_xcorr"
      title: "Comet Xcorr Distribution"
      xlab: "Xcorr"
      ylab: "Frequency"

  peptide_intensity_plot:
    plot_type: "boxplot"
    file_format: "csv"
    section_name: "Peptide Intensity"
    description: |
      Comparison of log2-transformed peptide intensities across samples.
      Helps assess data consistency and detect potential outliers or batch effects.
    pconfig:
      id: "peptide_intensity"
      title: "Peptide Intensity Distribution"
      xlab: "log2(Intensity)"

  epicore_length_distribution:
    file_format: "html"
    section_name: "Epicore length distribution"
    description: "The histogram visualizes the number and length of the input peptides in the evidence file in grey. The red bars correspond to the number of identified consensus epitopes and their length."

  epicore_intensity_histogram:
    file_format: "html"
    section_name: "Epicore intensity histogram"
    description: "The histogram visualizes how many peptides contribute to each identified consensus epitope."

