custom_logo: "nf-core-mhcquant_logo_light.png"
custom_logo_url: https://github.com/nf-core/mhcquant
custom_logo_title: "nf-core/mhcquant"

report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/mhcquant/releases/tag/3.3.0" target="_blank">nf-core/mhcquant</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/mhcquant/3.3.0/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-mhcquant-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-mhcquant-summary":
    order: -1002

export_plots: true
disable_version_detection: true

# Box plots receive precomputed Tukey statistics (1.5 × IQR whiskers), so no points are drawn
boxplot_boxpoints: false

# Modules to run
run_modules:
  - custom_content
  - percolator

# Custom tables and plots
custom_data:
  # Summary of general statistics
  stats_table:
    plot_type: "table"
    file_format: "csv"
    section_name: "General Statistics"
    pconfig:
      id: "general_stats"
      title: "General Statistics"

  # Summary of chromatogram plot
  chromatogram:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "MS1 Chromatogram"
    description: |
      Total ion current of the MS1 scans over retention time, which shows the elution profile of each run.
    pconfig:
      xlab: "Retention time [min]"
      xmin: 0
      ylab: "Intensity"
      logswitch: true
      logswitch_active: true

  # Mass error plot
  mass_error:
    plot_type: "boxplot"
    file_format: "json"
    section_name: "Fragment mass error"
    description: |
      Deviation of observed from theoretical fragment ion m/z in Da for the identified spectra, one box per run.
      A narrow box centered on zero indicates a well calibrated instrument.
      Whiskers reach the last value within 1.5 × IQR of the box, and outliers are not drawn.
    pconfig:
      xlab: "Mass deviation [Da]"

  len_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Peptide lengths"
    description: |
      Length distribution of the identified peptides. HLA class I ligands typically peak at 9 amino acids,
      while class II ligands are longer and more spread out.
    pconfig:
      id: "length_dist"
      title: "Distribution of peptide lengths"
      xlab: "Length"
      ylab: "Frequency"

  mz_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Mass-to-Charge"
    description: |
      Distribution of the precursor m/z values of the identified peptides.
    pconfig:
      id: "histogram_mz"
      title: "Mass-to-Charge Histogram"
      xlab: "m/z"
      ylab: "Frequency"

  rt_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Retention time"
    description: |
      Distribution of the retention times of the identified peptides across the gradient.
    pconfig:
      id: "histogram_rt"
      title: "Retention time Histogram"
      xlab: "Retention time"
      ylab: "Frequency"

  im_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Ion Mobility"
    description: |
      Distribution of the ion mobility (1/K0) values of the identified peptides. This plot only appears for data
      with ion mobility separation, such as timsTOF.
    pconfig:
      id: "histogram_im"
      title: "Ion Mobility Distribution"
      xlab: "Ion Mobility (1/K0) [V·s/cm²]"
      ylab: "Frequency"

  qvalue_plot:
    plot_type: "linegraph"
    file_format: "csv"
    section_name: "Q-Value"
    description: |
      Distribution of the Percolator q-values of the reported PSMs. All values lie below the FDR threshold
      (1% by default).
    pconfig:
      id: "histogram_scores"
      title: "Percolator q-value Histogram"
      xlab: "q-value"
      ylab: "Frequency"

  scores_plot_xcorr:
    plot_type: "boxplot"
    file_format: "json"
    section_name: "Xcorr-Value"
    description: |
      Distribution of the Comet cross-correlation scores (Xcorr) of the reported PSMs, one box per sample and condition.
      Higher values indicate better peptide-spectrum matches.
      Whiskers reach the last value within 1.5 × IQR of the box, and outliers are not drawn.
    pconfig:
      id: "scores_xcorr"
      title: "Comet Xcorr Distribution"
      xlab: "Xcorr"
      ylab: "Frequency"

  peptide_intensity_plot:
    plot_type: "boxplot"
    file_format: "json"
    section_name: "Peptide Intensity"
    description: |
      Distribution of the log2 peptide intensities, one box per sample and condition. A shifted box can point to
      differences in sample loading or to batch effects.
      Whiskers reach the last value within 1.5 × IQR of the box, and outliers are not drawn.
    pconfig:
      id: "peptide_intensity"
      title: "Peptide Intensity Distribution"
      xlab: "log2(Intensity)"

  deeplc_rt_calibration:
    plot_type: "boxplot"
    file_format: "json"
    section_name: "DeepLC RT calibration"
    description: |
      Absolute difference between observed and DeepLC-predicted retention time for the FDR-filtered target PSMs,
      one box per sample and condition. Values are in percent of the gradient (the latest observed retention time),
      so runs with different LC setups are comparable. Low values mean that DeepLC predicts retention times well.
      Whiskers reach the last value within 1.5 × IQR of the box, and outliers are not drawn.
    pconfig:
      id: "deeplc_rt_calibration"
      title: "DeepLC RT calibration"
      xlab: "RT prediction error [% of gradient]"

  aligned_residuals:
    plot_type: "boxplot"
    file_format: "json"
    section_name: "Aligned residuals"
    description: |
      Retention time residuals of the alignment landmarks (reference minus fitted retention time) in percent
      of the gradient, one box per run. A narrow box centered on zero means the run aligned well onto the other
      runs of its sample and condition. A wide box points to retention time shifts that the linear alignment
      could not correct, which can cost matches between runs.
      Whiskers reach the last value within 1.5 × IQR of the box, and outliers are not drawn.
    pconfig:
      id: "aligned_residuals"
      title: "Aligned residuals"
      xlab: "Residual [% of gradient]"

  epicore_length_distribution:
    file_format: "html"
    section_name: "Epicore length distribution"
    description: "Length distribution of the input peptides (grey) and of the identified consensus epitopes (red)."

  epicore_intensity_histogram:
    file_format: "html"
    section_name: "Epicore intensity histogram"
    description: "Number of peptides that contribute to each identified consensus epitope."

sp:
  chromatogram:
    fn: "*_chrom.csv"
  mass_error:
    fn: "*_frag_mass_err.json"
  stats_table:
    fn: "*_general_stats.csv"
  len_plot:
    fn: "*_peptide_length.csv"
  mz_plot:
    fn: "*_histogram_mz.csv"
  rt_plot:
    fn: "*_histogram_rt.csv"
  im_plot:
    fn: "*_histogram_im.csv"
  qvalue_plot:
    fn: "*_histogram_scores.csv"
  scores_plot_xcorr:
    fn: "*_xcorr_scores.json"
  peptide_intensity_plot:
    fn: "*_peptide_intensity.json"
  deeplc_rt_calibration:
    fn: "*_deeplc_rt_diff.json"
  aligned_residuals:
    fn: "*_aligned_residuals.json"
  epicore_length_distribution:
    fn: "epicore_length_distribution.html"
  epicore_intensity_histogram:
    fn: "epicore_intensity_histogram.html"

